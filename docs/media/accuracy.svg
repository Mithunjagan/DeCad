<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="Segoe UI Variable, Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101112"/><stop offset="1" stop-color="#171819"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9875f"/><stop offset="1" stop-color="#e7b58b"/>
    </linearGradient>
    <linearGradient id="total" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f9479"/><stop offset="1" stop-color="#81b89b"/>
    </linearGradient>
    <style>
      .h  { fill: #f1eee8; font-size: 22px; font-weight: 600; }
      .sub{ fill: #9c9c99; font-size: 14px; }
      .l  { fill: #eeeae4; font-size: 16px; font-weight: 600; }
      .v  { fill: #eeeae4; font-size: 16px; font-weight: 600; font-family: Cascadia Code, SFMono-Regular, Consolas, monospace; }
      .track { fill: #1e2021; }
      .fill { transform-box: fill-box; transform-origin: left center; animation: grow 6s cubic-bezier(.2,.8,.2,1) infinite; }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .7s; } .d5 { animation-delay: 1s; }
      @keyframes grow { 0% { transform: scaleX(0); } 30%,88% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: .2; } }
    </style>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="1198.5" height="328.5" rx="17.5" fill="none" stroke="#2b2d2e" stroke-width="1.5"/>
  <text class="h" x="48" y="52">Labelled pin → net <tspan font-family="Georgia, Times New Roman, serif" font-style="italic" font-weight="400" fill="#e7b58b">exact</tspan>, scored from the saved .DSN</text>
  <text class="sub" x="48" y="76">fresh GPU run · hand-transcribed ground truth · every design reopened in OrCAD Capture</text>

  <g transform="translate(0 112)">
    <text class="l" x="48" y="19">Sample 1</text><rect class="track" x="250" y="2" width="760" height="22" rx="11"/><rect class="fill d1" x="250" y="2" width="692" height="22" rx="11" fill="url(#bar)"/><text class="v" x="1030" y="19">51/56 · 91%</text>
  </g>
  <g transform="translate(0 150)">
    <text class="l" x="48" y="19">Sample 3</text><rect class="track" x="250" y="2" width="760" height="22" rx="11"/><rect class="fill d2" x="250" y="2" width="650" height="22" rx="11" fill="url(#bar)"/><text class="v" x="1030" y="19">59/69 · 86%</text>
  </g>
  <g transform="translate(0 188)">
    <text class="l" x="48" y="19">Sample 4</text><rect class="track" x="250" y="2" width="760" height="22" rx="11"/><rect class="fill d3" x="250" y="2" width="676" height="22" rx="11" fill="url(#bar)"/><text class="v" x="1030" y="19">64/72 · 89%</text>
  </g>
  <g transform="translate(0 226)">
    <text class="l" x="48" y="19">Sample 5</text><rect class="track" x="250" y="2" width="760" height="22" rx="11"/><rect class="fill d4" x="250" y="2" width="616" height="22" rx="11" fill="url(#bar)"/><text class="v" x="1030" y="19">39/48 · 81%</text>
  </g>
  <g transform="translate(0 270)">
    <text class="l" x="48" y="21" style="fill:#97c8ae">All clear sheets</text><rect class="track" x="250" y="2" width="760" height="26" rx="13"/><rect class="fill d5" x="250" y="2" width="661" height="26" rx="13" fill="url(#total)"/><text class="v" x="1030" y="21" style="fill:#97c8ae">213/245 · 87%</text>
  </g>
</svg>
