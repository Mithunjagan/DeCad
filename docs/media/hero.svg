<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="Segoe UI Variable, Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101112"/>
      <stop offset="1" stop-color="#171819"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2b2d2e"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type"><rect x="0" y="222" height="44" width="0">
      <animate attributeName="width" values="0;1200;1200;0" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
    </rect></clipPath>
    <style>
      .trace { fill: none; stroke: #2b2d2e; stroke-width: 2; }
      .live  { fill: none; stroke: #e7b58b; stroke-width: 2; stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 6s ease-in-out infinite; }
      .live.b { stroke: #81b89b; animation-delay: 1.2s; }
      .live.c { stroke: #eac37c; animation-delay: 2.4s; }
      @keyframes draw { 0% { stroke-dashoffset: 900; } 45% { stroke-dashoffset: 0; } 80% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      .chip { fill: #1e2021; stroke: #414344; stroke-width: 1.5; }
      .pin  { stroke: #414344; stroke-width: 2; }
      .lbl  { fill: #9c9c99; font-size: 13px; font-family: Cascadia Code, SFMono-Regular, Consolas, monospace; }
      .tag  { fill: #171819; stroke: #383a3b; stroke-width: 1.2; }
      .tagt { fill: #eeeae4; font-size: 15px; font-weight: 600; }
      .eyebrow { fill: #b8ada0; font-size: 12px; font-weight: 600; letter-spacing: 2.4px; }
      .blink { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)" opacity=".8"/>
  <rect x=".75" y=".75" width="1198.5" height="378.5" rx="17.5" fill="none" stroke="#2b2d2e" stroke-width="1.5"/>

  <!-- background circuit -->
  <g>
    <rect class="chip" x="70" y="60" width="90" height="120" rx="6"/>
    <g class="pin"><line x1="40" y1="80" x2="70" y2="80"/><line x1="40" y1="105" x2="70" y2="105"/><line x1="40" y1="130" x2="70" y2="130"/><line x1="40" y1="155" x2="70" y2="155"/><line x1="160" y1="80" x2="190" y2="80"/><line x1="160" y1="105" x2="190" y2="105"/><line x1="160" y1="130" x2="190" y2="130"/><line x1="160" y1="155" x2="190" y2="155"/></g>
    <text class="lbl" x="115" y="125" text-anchor="middle">74F240</text>
    <rect class="chip" x="1030" y="200" width="100" height="130" rx="6"/>
    <g class="pin"><line x1="1000" y1="220" x2="1030" y2="220"/><line x1="1000" y1="248" x2="1030" y2="248"/><line x1="1000" y1="276" x2="1030" y2="276"/><line x1="1000" y1="304" x2="1030" y2="304"/><line x1="1130" y1="220" x2="1160" y2="220"/><line x1="1130" y1="248" x2="1160" y2="248"/><line x1="1130" y1="276" x2="1160" y2="276"/><line x1="1130" y1="304" x2="1160" y2="304"/></g>
    <text class="lbl" x="1080" y="270" text-anchor="middle">AM2910</text>

    <path class="trace" d="M190 80 H330 V40 H880 V120 H1000"/>
    <path class="trace" d="M190 130 H260 V330 H1000 V304"/>
    <path class="trace" d="M190 155 H230 V355 H1160 V304"/>
    <path id="p1" class="live"   d="M190 80 H330 V40 H880 V120 H1000"/>
    <path id="p2" class="live b" d="M190 130 H260 V330 H1000 V304"/>
    <path id="p3" class="live c" d="M190 155 H230 V355 H1160 V304"/>

    <circle r="5" fill="#f3d2b3" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5" fill="#97c8ae" filter="url(#glow)"><animateMotion dur="5s" begin="1s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5" fill="#eac37c" filter="url(#glow)"><animateMotion dur="6s" begin="2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <g fill="#e7b58b" class="blink"><circle cx="330" cy="40" r="4"/><circle cx="880" cy="120" r="4"/><circle cx="260" cy="330" r="4"/></g>
  </g>

  <!-- eyebrow -->
  <g transform="translate(600 92)">
    <line x1="-212" y1="-4" x2="-184" y2="-4" stroke="#e7b58b" stroke-width="1.5"/>
    <text class="eyebrow" x="0" y="0" text-anchor="middle">SCHEMATIC SCANS  →  NATIVE ORCAD</text>
    <line x1="184" y1="-4" x2="212" y2="-4" stroke="#e7b58b" stroke-width="1.5"/>
  </g>

  <!-- wordmark: brand headline style, sans + Georgia italic copper -->
  <text x="600" y="190" text-anchor="middle" font-size="98" letter-spacing="-4"><tspan fill="#f1eee8" font-weight="460">De</tspan><tspan fill="#e7b58b" font-family="Georgia, Times New Roman, serif" font-style="italic" font-weight="400" filter="url(#glow)">Cad</tspan></text>

  <g clip-path="url(#type)">
    <text x="600" y="255" text-anchor="middle" font-size="26" font-weight="400" fill="#eeeae4">Scanned schematic in → <tspan font-family="Georgia, Times New Roman, serif" font-style="italic" fill="#e7b58b">verified</tspan> native OrCAD design out</text>
  </g>

  <!-- tags -->
  <g transform="translate(270 290)">
    <rect class="tag" width="150" height="34" rx="17"/><circle cx="20" cy="17" r="4" fill="#e7b58b"/><text class="tagt" x="82" y="22" text-anchor="middle">87% exact pins</text>
    <rect class="tag" x="166" width="190" height="34" rx="17"/><circle cx="186" cy="17" r="4" fill="#81b89b"/><text class="tagt" x="268" y="22" text-anchor="middle">Pin-by-pin verified</text>
    <rect class="tag" x="372" width="120" height="34" rx="17"/><circle cx="392" cy="17" r="4" fill="#eac37c"/><text class="tagt" x="438" y="22" text-anchor="middle">CUDA OCR</text>
    <rect class="tag" x="508" width="152" height="34" rx="17"/><circle cx="528" cy="17" r="4" fill="#81b89b"/><text class="tagt" x="590" y="22" text-anchor="middle">0 netlist errors</text>
  </g>
</svg>
