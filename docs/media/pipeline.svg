<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" font-family="Segoe UI Variable, Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101112"/><stop offset="1" stop-color="#171819"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="114" y1="0" x2="1094" y2="0">
      <stop offset="0" stop-color="#e7b58b"/><stop offset=".55" stop-color="#eac37c"/><stop offset="1" stop-color="#81b89b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .node { fill: #171819; stroke: #383a3b; stroke-width: 1.5; }
      .node.on { animation: lit 7s ease-in-out infinite; }
      @keyframes lit { 0%,100% { stroke: #383a3b; fill: #171819; } 8%,22% { stroke: #e7b58b; fill: #1e2021; } }
      .n2 { animation-delay: 1.1s !important; } .n3 { animation-delay: 2.2s !important; }
      .n4 { animation-delay: 3.3s !important; } .n5 { animation-delay: 4.4s !important; } .n6 { animation-delay: 5.5s !important; }
      .num { fill: #e7b58b; font-size: 13px; font-weight: 600; letter-spacing: 1.5px; font-family: Cascadia Code, SFMono-Regular, Consolas, monospace; }
      .t  { fill: #eeeae4; font-size: 17px; font-weight: 600; }
      .s  { fill: #9c9c99; font-size: 12.5px; }
      .dash { stroke: url(#flow); stroke-width: 2.5; fill: none; stroke-dasharray: 8 10; animation: run 1.2s linear infinite; }
      @keyframes run { to { stroke-dashoffset: -36; } }
      .chev { opacity: .3; animation: chev 7s ease-in-out infinite; }
      @keyframes chev { 0%,100% { opacity: .3; } 6%,14% { opacity: 1; } }
      .ok { animation: pop 7s ease-in-out infinite; animation-delay: 5.8s; transform-origin: 1158px 82px; }
      @keyframes pop { 0%,100% { opacity: .35; transform: scale(1); } 6% { opacity: 1; transform: scale(1.25); } 20% { opacity: 1; transform: scale(1); } }
    </style>
  </defs>
  <rect width="1200" height="270" rx="18" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="1198.5" height="268.5" rx="17.5" fill="none" stroke="#2b2d2e" stroke-width="1.5"/>

  <path id="wire" class="dash" d="M114 212 H1094"/>
  <circle r="6" fill="#f3d2b3" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear"><mpath href="#wire"/></animateMotion>
  </circle>

  <g>
    <rect class="node on n1" x="30"  y="62" width="168" height="126" rx="12"/>
    <text class="num" x="52" y="92">01</text>
    <text class="t" x="52" y="132">Scan / PDF</text>
    <text class="s" x="52" y="156">JPEG · PNG · 400 dpi PDF</text>

    <rect class="node on n2" x="226" y="62" width="168" height="126" rx="12"/>
    <text class="num" x="248" y="92">02</text>
    <text class="t" x="248" y="132">Assess &amp; enhance</text>
    <text class="s" x="248" y="156">blur · skew · text size</text>

    <rect class="node on n3" x="422" y="62" width="168" height="126" rx="12"/>
    <text class="num" x="444" y="92">03</text>
    <text class="t" x="444" y="132">GPU OCR</text>
    <text class="s" x="444" y="156">RapidOCR + CRNN</text>

    <rect class="node on n4" x="618" y="62" width="168" height="126" rx="12"/>
    <text class="num" x="640" y="92">04</text>
    <text class="t" x="640" y="132">Pins &amp; nets</text>
    <text class="s" x="640" y="156">wires · bodies · labels</text>

    <rect class="node on n5" x="814" y="62" width="168" height="126" rx="12"/>
    <text class="num" x="836" y="92">05</text>
    <text class="t" x="836" y="132">Library check</text>
    <text class="s" x="836" y="156">26k Capture packages</text>

    <rect class="node on n6" x="1010" y="62" width="168" height="126" rx="12"/>
    <text class="num" x="1032" y="92">06</text>
    <text class="t" x="1032" y="132">Native <tspan font-family="Georgia, Times New Roman, serif" font-style="italic" font-weight="400" fill="#e7b58b">.DSN</tspan></text>
    <text class="s" x="1032" y="156">reopened &amp; verified</text>
  </g>
  <g>
    <path class="chev" style="animation-delay:.6s"  d="M207 116 l9 9 l-9 9" stroke="#e7b58b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="chev" style="animation-delay:1.7s" d="M403 116 l9 9 l-9 9" stroke="#e7b58b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="chev" style="animation-delay:2.8s" d="M599 116 l9 9 l-9 9" stroke="#e7b58b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="chev" style="animation-delay:3.9s" d="M795 116 l9 9 l-9 9" stroke="#e7b58b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="chev" style="animation-delay:5.0s" d="M991 116 l9 9 l-9 9" stroke="#e7b58b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <g class="ok"><circle cx="1158" cy="82" r="13" fill="#81b89b"/><path d="M1151 82 l5 5 l9 -10" stroke="#101112" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>

  <text x="600" y="250" text-anchor="middle" class="s">every saved design is reopened through Capture's own database and checked pin by pin before it is returned</text>
</svg>
