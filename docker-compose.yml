name: schematic2sdn-finished
services:
  kicad:
    init: true
    mem_limit: 1g
    cpus: 2.0
    build:
      context: .
      dockerfile: docker/kicad/Dockerfile
    ports:
      - "127.0.0.1:8100:8000"
      - "127.0.0.1:6180:6080"
    environment:
      S2SDN_HOST_UID: ${S2SDN_HOST_UID:-1000}
      S2SDN_HOST_GID: ${S2SDN_HOST_GID:-1000}
      OLLAMA_URL: ${OLLAMA_URL:-http://vision:11434}
      VISION_OLLAMA_URL: ${VISION_OLLAMA_URL:-}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl:2b-instruct}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:0.6b}
      IMAGE_MODE: ${IMAGE_MODE:-circuit}
      HOST_PROJECTS_DIR: ${HOST_PROJECTS_DIR:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/workspaces:/workspaces
      - ./backend/.state:/state
      - ./backend/datasets:/datasets
      - ./libraries:/libraries:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
  frontend:
    init: true
    mem_limit: 512m
    cpus: 1.0
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      kicad:
        condition: service_healthy
        restart: true
    restart: unless-stopped
  vision:
    image: ollama/ollama:latest
    profiles: ["vision"]
    mem_limit: ${MODEL_MEMORY_LIMIT:-2g}
    memswap_limit: ${MODEL_MEMORY_LIMIT:-2g}
    cpus: 2.0
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_CONTEXT_LENGTH: 2048
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - vision-models:/root/.ollama
    restart: "no"
volumes:
  vision-models:
