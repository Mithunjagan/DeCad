<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; background: #010409; }
.reveal { position: absolute; inset: 0; }
.reveal .base, .reveal .tile img {
  position: absolute; max-width: none;
}
.reveal .tile { position: absolute; overflow: hidden; opacity: 1; }
</style>
</head>
<body>
<div style='position: relative; width: 800px; height: 600px; background: #111;'>
  <div class='reveal'>
    <img class='base' src='frontend/public/r1.jpg' style='inset:0; width:100%; height:100%; object-fit:cover;' />
  </div>
</div>
</body>
</html>
