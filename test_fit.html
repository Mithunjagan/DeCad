<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #010409; }
.reveal { position: absolute; inset: 0; }
.reveal .tile { position: absolute; overflow: hidden; }
.reveal .tile img { position: absolute; max-width: none; width: 1000%; height: 700%; object-fit: cover; }
</style>
</head>
<body>
<div style='position: relative; width: 800px; height: 600px;'>
  <div class='reveal'>
    <div class='tile' style='left: 20%; top: 20%; width: 10%; height: 14.285%;'>
      <img src='frontend/public/r1.jpg' style='left: -200%; top: -140%;' />
    </div>
  </div>
</div>
</body>
</html>
