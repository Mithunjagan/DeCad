name: Release validation
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop-bridge:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m unittest discover -s tools -p test_check_release.py -v
      - run: python -m pytest backend/tests/test_bridge_portability.py -q
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('start.ps1','stop.ps1')) {
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
  circuit-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build kicad
      - run: docker compose build frontend
      - run: docker run --rm --memory=1g --cpus=2 -e KICAD_EMBEDDED=false -v "${{ github.workspace }}/backend/tests:/app/backend/tests:ro" -v "${{ github.workspace }}/bridge:/app/bridge:ro" -v "${{ github.workspace }}/training:/app/training:ro" schematic2sdn-finished-kicad sh -c 'pip install pytest && python -m pytest tests -q'
